name: PR hygiene

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  overlapping-prs:
    name: no duplicate or stacked PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for commit overlap with other open PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node .github/scripts/check-overlapping-prs.mjs
          "${{ github.repository }}" "${{ github.event.pull_request.number }}"

  cast-comments:
    name: added 'as' casts carry a comment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check added TypeScript casts
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$BASE"
          node .github/scripts/check-added-casts.mjs "origin/$BASE" "$HEAD_SHA"
